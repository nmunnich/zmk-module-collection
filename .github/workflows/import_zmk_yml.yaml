name: Import ZMK YAML files into .yaml-mirrors
# This workflow imports ZMK YAML files into the .yaml-mirrors directory
# and commits them to the repository.

on: [push]

permissions:
  contents: write # Required to push changes to the repository

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: West Init
        run: west init -l main

      - name: West Update
        run: west update

      - name: Find and copy YAML files
        run: |
          chmod +x ./main/.tools/safe_file_cp.sh
          # Find all .yaml files and copy them to the target folder
          find . -path "./zmk-keyboards-*" -type f -name "*.zmk.yml" -exec ./main/.tools/safe_file_cp.sh {} ./main/.yaml-mirrors/keyboards/ \;
          # Optional: List files in the target folder to verify
          ls -R ./main/.yaml-mirrors
      
      - name: Commit imported files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./main
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./.yaml-mirrors/keyboards/
          git commit -m "Import YAML files into .yaml-mirrors"
          git push "https://${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}